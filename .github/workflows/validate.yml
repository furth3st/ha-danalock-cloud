name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # every Monday: catch Home Assistant / HACS rule changes early
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest (Home Assistant manifest/translations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
