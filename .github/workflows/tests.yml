name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # every Monday against the newest Home Assistant release
  workflow_dispatch:

jobs:
  pytest:
    name: Pytest (latest Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install latest Home Assistant test harness
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run tests
        run: pytest -q
